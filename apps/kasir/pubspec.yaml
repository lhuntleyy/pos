name: kasir
description: App kasir POS Kita untuk HP, tablet, dan mesin kasir Android. Offline-first.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  # Ditambahkan sesuai story:
  # drift + drift_flutter + sqlite3_flutter_libs  → S-01 (database lokal)
  # dio / http                                   → S-02 (sinkron)
  # esc_pos_utils_plus + print_bluetooth_thermal → H-01 (printer)
  # mobile_scanner                               → K-07 (barcode kamera)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Font Plus Jakarta Sans (lisensi OFL) dibundel di sini supaya tetap tampil saat offline:
  # fonts:
  #   - family: Plus Jakarta Sans
  #     fonts:
  #       - asset: assets/fonts/PlusJakartaSans-Regular.ttf
  #       - asset: assets/fonts/PlusJakartaSans-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
  #         weight: 800
