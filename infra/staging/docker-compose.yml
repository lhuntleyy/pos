# Staging di satu VPS Indonesia (story F-02). Isi .env dari .env.example dulu.
#   docker compose --env-file .env up -d
# Image api dan wa-gateway dibangun oleh CI dan didorong ke GHCR (lihat README di folder ini).
name: pos-staging

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www/app:/srv/app:ro # hasil build apps/web
      - ./www/site:/srv/site:ro # hasil build apps/site
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: ${API_IMAGE:-ghcr.io/OWNER/pos-api:main}
    restart: unless-stopped
    environment:
      APP_ENV: staging
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://pos_app:${POS_APP_DB_PASSWORD}@postgres:5432/pos?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/pos?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN},https://${SITE_DOMAIN}
      WA_GATEWAY_URL: http://wa-gateway:8090
      WA_GATEWAY_SECRET: ${WA_GATEWAY_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  wa-gateway:
    image: ${WA_IMAGE:-ghcr.io/OWNER/pos-wa-gateway:main}
    restart: unless-stopped
    # Tidak ada "ports": hanya bisa diakses dari jaringan internal Docker (ADR-0005).
    environment:
      WA_PROVIDER: baileys
      GATEWAY_SECRET: ${WA_GATEWAY_SECRET}
      SESSION_ENCRYPTION_KEY: ${WA_SESSION_ENCRYPTION_KEY}
      SESSION_DIR: /data/sessions
      DAILY_LIMIT: "300"
    volumes:
      - wa_sessions:/data/sessions

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pos"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:
  wa_sessions:
