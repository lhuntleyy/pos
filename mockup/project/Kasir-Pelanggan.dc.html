<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pelanggan dan kasbon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3B35B5}a:hover{color:#2A2590}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #E39D00;outline-offset:2px}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F6FB; color: #181A2E; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">
  <header style="height: 64px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: #FFFFFF; border-bottom: 1px solid #D9DBEA">
    <div style="width: 36px; height: 36px; border-radius: 10px; background: #3B35B5; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px">k</div>
    <span style="font-weight: 800; font-size: 18px">Pelanggan &amp; kasbon</span>
    <span style="padding: 5px 12px; border-radius: 999px; background: #FFF2D2; color: #6B4600; font-size: 14px; font-weight: 800">Total kasbon belum lunas Rp1.245.000 · 6 orang</span>
    <div style="flex: 1"></div>
    <button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #3B35B5; color: #FFFFFF; font-weight: 800; font-size: 15px">+ Pelanggan baru</button>
  </header>
  <div style="flex: 1; min-height: 0; display: flex">
    <section aria-label="Daftar pelanggan" style="width: 460px; flex: none; border-right: 1px solid #D9DBEA; display: flex; flex-direction: column">
      <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
        <label for="cari-plg" style="height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border: 1px solid #D9DBEA; border-radius: 12px; background: #FFFFFF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#51546F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input id="cari-plg" type="search" placeholder="Cari nama atau nomor HP" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px"></label>
        <div role="group" aria-label="Saring" style="display: flex; gap: 8px">
          <button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #D9DBEA; background: #FFFFFF; color: #181A2E; font-weight: 700; font-size: 14px">Semua</button>
          <button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 0; background: #3B35B5; color: #FFFFFF; font-weight: 800; font-size: 14px">Ada kasbon</button>
          <button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #D9DBEA; background: #FFFFFF; color: #181A2E; font-weight: 700; font-size: 14px">Member</button>
        </div>
      </div>
      <div style="flex: 1; min-height: 0; overflow: auto; padding: 0 16px">
        <sc-for list="{{ people }}" as="p" hint-placeholder-count="7">
          <button type="button" aria-pressed="{{p.on}}" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 6px; border-radius: 12px; border: {{p.border}}; background: {{p.bg}}; color: #181A2E; text-align: left">
            <span style="width: 44px; height: 44px; border-radius: 50%; background: #FFF2D2; color: #6B4600; display: flex; align-items: center; justify-content: center; font-weight: 800; flex: none">{{p.ini}}</span>
            <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 800">{{p.name}}</span><span style="font-size: 14px; color: #51546F">{{p.meta}}</span></span>
            <span style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; color: {{p.fg}}">{{p.debt}}</span><span style="font-size: 12px; font-weight: 700; color: {{p.fg}}">{{p.due}}</span></span>
          </button>
        </sc-for>
      </div>
    </section>
    <section aria-label="Pak Joko" style="flex: 1; min-width: 0; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 14px">
        <span style="width: 60px; height: 60px; border-radius: 50%; background: #FFF2D2; color: #6B4600; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px">PJ</span>
        <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 800">Pak Joko</span><span style="font-size: 15px; color: #51546F">0812-****-7781 · pelanggan sejak Mar 2026</span></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <div style="background: #FBE3E0; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700; color: #B42318">Kasbon belum lunas</span><span style="font-size: 30px; font-weight: 800; color: #B42318; font-variant-numeric: tabular-nums">Rp185.000</span></div>
        <div style="background: #FFFFFF; border: 1px solid #D9DBEA; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700; color: #51546F">Batas kasbon</span><span style="font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums">Rp500.000</span></div>
        <div style="background: #FFFFFF; border: 1px solid #D9DBEA; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700; color: #51546F">Jatuh tempo</span><span style="font-size: 30px; font-weight: 800">30 Nov</span></div>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #D9DBEA; border-radius: 16px; padding: 6px 18px; flex: 1; min-height: 0; overflow: auto">
        <sc-for list="{{ hist }}" as="h" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #EDEEF7; font-size: 16px">
            <span style="width: 90px; color: #51546F; font-variant-numeric: tabular-nums">{{h.d}}</span>
            <span style="flex: 1">{{h.t}}</span>
            <span style="font-weight: 800; font-variant-numeric: tabular-nums; color: {{h.fg}}">{{h.v}}</span>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 10px">
        <button type="button" style="flex: 1; height: 60px; border-radius: 14px; border: 2px solid #D9DBEA; background: #FFFFFF; color: #181A2E; font-weight: 800; font-size: 16px">Kirim pengingat ke WA</button>
        <button type="button" style="flex: 1.3; height: 60px; border-radius: 14px; border: 0; background: #16774A; color: #FFFFFF; font-weight: 800; font-size: 17px">Catat pembayaran kasbon</button>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [['PJ', 'Pak Joko', 'Terakhir 15 Nov · 12 transaksi', 'Rp185.000', 'Jatuh tempo 30 Nov', '#B42318', true], ['BW', 'Bu Wati', 'Terakhir 14 Nov', 'Rp320.000', 'Lewat 6 hari', '#B42318'], ['MS', 'Mas Seno', 'Terakhir 12 Nov', 'Rp95.000', 'Jatuh tempo 20 Nov', '#6B4600'], ['ID', 'Ibu Dewi (katering)', 'Terakhir 10 Nov', 'Rp410.000', 'Jatuh tempo 25 Nov', '#6B4600'], ['AR', 'Arif', 'Terakhir 9 Nov', 'Rp60.000', 'Jatuh tempo 23 Nov', '#6B4600'], ['RN', 'Bu Rina', 'Member Emas', 'Rp0', 'Lunas', '#16774A'], ['TO', 'Toni', 'Terakhir 8 Nov', 'Rp175.000', 'Lewat 2 hari', '#B42318']];
    const people = P.map(p => ({ ini: p[0], name: p[1], meta: p[2], debt: p[3], due: p[4], fg: p[5], on: !!p[6], border: p[6] ? '2px solid #3B35B5' : '1px solid #D9DBEA', bg: p[6] ? '#F1F0FD' : '#FFFFFF' }));
    const hist = [['15 Nov', 'Kasbon · nota S-0409 (kopi &amp; gorengan)', '+Rp34.000', '#B42318'], ['12 Nov', 'Bayar kasbon tunai', '−Rp100.000', '#16774A'], ['10 Nov', 'Kasbon · nota S-0288', '+Rp87.000', '#B42318'], ['6 Nov', 'Kasbon · nota S-0201', '+Rp64.000', '#B42318'], ['1 Nov', 'Kasbon · nota S-0112', '+Rp100.000', '#B42318']].map(h => ({ d: h[0], t: h[1].replace('&amp;', '&'), v: h[2], fg: h[3] }));
    return { people: people, hist: hist };
  }
}
</script>
</body>
</html>
