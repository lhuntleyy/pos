<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kasir warung di HP</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3B35B5}a:hover{color:#2A2590}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #E39D00;outline-offset:2px}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F6FB; color: #181A2E; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">
  <header style="padding: 16px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #D9DBEA; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.25">
        <span style="font-size: 20px; font-weight: 800">Warung Bu Sri</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #16774A">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
          Data aman tersimpan
        </span>
      </div>
      <span style="padding: 6px 10px; border-radius: 999px; background: #E6E5FA; color: #3B35B5; font-size: 13px; font-weight: 800">Teks besar</span>
      <button type="button" style="height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid #D9DBEA; background: #FFFFFF; color: #181A2E; font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 6px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
        Menu
      </button>
    </div>
    <label for="cari-hp" style="height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border: 1px solid #D9DBEA; border-radius: 12px; background: #F6F6FB">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#51546F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="cari-hp" type="search" placeholder="Cari barang" style="flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 18px; color: #181A2E">
      <span style="font-size: 14px; font-weight: 700; color: #3B35B5">Scan</span>
    </label>
    <div role="tablist" aria-label="Kategori" style="display: flex; gap: 8px; overflow-x: auto">
      <button type="button" role="tab" aria-selected="true" style="flex: none; height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: #3B35B5; color: #FFFFFF; font-weight: 800; font-size: 16px">Semua</button>
      <button type="button" role="tab" aria-selected="false" style="flex: none; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D9DBEA; background: #FFFFFF; color: #181A2E; font-weight: 700; font-size: 16px">Nasi &amp; lauk</button>
      <button type="button" role="tab" aria-selected="false" style="flex: none; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D9DBEA; background: #FFFFFF; color: #181A2E; font-weight: 700; font-size: 16px">Gorengan</button>
      <button type="button" role="tab" aria-selected="false" style="flex: none; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D9DBEA; background: #FFFFFF; color: #181A2E; font-weight: 700; font-size: 16px">Minuman</button>
    </div>
  </header>

  <ul style="flex: 1; min-height: 0; overflow: auto; list-style: none; margin: 0; padding: 4px 16px">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="9">
      <li style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #E4E5F0">
        <span style="width: 8px; align-self: stretch; border-radius: 4px; background: {{it.color}}"></span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 18px; font-weight: 700; line-height: 1.3">{{it.name}}</span>
          <span style="font-size: 17px; color: #51546F; font-variant-numeric: tabular-nums">{{it.price}}</span>
        </div>
        <sc-if value="{{ it.inCart }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 4px">
            <button type="button" aria-label="Kurangi {{it.name}}" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #D9DBEA; background: #FFFFFF; color: #181A2E; font-size: 24px; font-weight: 700">−</button>
            <span style="min-width: 34px; text-align: center; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums">{{it.qty}}</span>
            <button type="button" aria-label="Tambah {{it.name}}" style="width: 48px; height: 48px; border-radius: 12px; border: 0; background: #3B35B5; color: #FFFFFF; font-size: 24px; font-weight: 700">+</button>
          </div>
        </sc-if>
        <sc-if value="{{ it.notInCart }}" hint-placeholder-val="{{ true }}">
          <button type="button" aria-label="Tambah {{it.name}}" style="height: 48px; padding: 0 16px; border-radius: 12px; border: 2px solid #3B35B5; background: #FFFFFF; color: #3B35B5; font-weight: 800; font-size: 16px">+ Tambah</button>
        </sc-if>
      </li>
    </sc-for>
  </ul>

  <div style="padding: 12px 16px 22px; background: #FFFFFF; border-top: 1px solid #D9DBEA; display: flex; align-items: center; gap: 12px">
    <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.2">
      <span style="font-size: 15px; color: #51546F; font-weight: 600">9 barang</span>
      <span style="font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums">Rp58.000</span>
    </div>
    <button type="button" style="height: 60px; padding: 0 28px; border-radius: 14px; border: 0; background: #3B35B5; color: #FFFFFF; font-weight: 800; font-size: 19px; display: flex; align-items: center; gap: 8px">
      Bayar
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const L = [
      { name: 'Nasi Rames', price: 'Rp15.000', qty: 2, color: '#F4B183' },
      { name: 'Nasi Pecel', price: 'Rp12.000', qty: 0, color: '#F4B183' },
      { name: 'Ayam Goreng', price: 'Rp12.000', qty: 1, color: '#F4B183' },
      { name: 'Telur Balado', price: 'Rp6.000', qty: 0, color: '#F4B183' },
      { name: 'Tempe Mendoan', price: 'Rp2.000', qty: 4, color: '#E8C26A' },
      { name: 'Bakwan Sayur', price: 'Rp2.000', qty: 0, color: '#E8C26A' },
      { name: 'Es Teh Manis', price: 'Rp4.000', qty: 2, color: '#8FCFB9' },
      { name: 'Kopi Hitam', price: 'Rp4.000', qty: 0, color: '#8FCFB9' },
      { name: 'Air Mineral 600 ml', price: 'Rp4.000', qty: 0, color: '#8FCFB9' }
    ];
    return { items: L.map(i => ({ name: i.name, price: i.price, qty: i.qty, color: i.color, inCart: i.qty > 0, notInCart: i.qty === 0 })) };
  }
}
</script>
</body>
</html>
