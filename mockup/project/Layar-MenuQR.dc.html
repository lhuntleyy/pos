<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Menu QR pelanggan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3B35B5}a:hover{color:#2A2590}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #E39D00;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #181A2E; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">
  <header style="padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #EDEEF7">
    <div style="display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; border-radius: 12px; background: #3B35B5; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px">S</span><div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 800">Kedai Kopi Senja</span><span style="font-size: 14px; color: #51546F">Meja 5 · pesan langsung dari HP</span></div></div>
    <div role="tablist" aria-label="Kategori" style="display: flex; gap: 8px; overflow-x: auto">
      <sc-for list="{{ cats }}" as="c" hint-placeholder-count="5"><button type="button" role="tab" aria-selected="{{c.on}}" style="flex: none; height: 44px; padding: 0 16px; border-radius: 999px; border: {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-weight: 700; font-size: 15px">{{c.label}}</button></sc-for>
    </div>
  </header>
  <ul style="flex: 1; min-height: 0; overflow: auto; list-style: none; margin: 0; padding: 4px 16px">
    <sc-for list="{{ items }}" as="i" hint-placeholder-count="6">
      <li style="display: flex; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid #EDEEF7">
        <span style="width: 64px; height: 64px; border-radius: 14px; background: {{i.bg}}; flex: none"></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 800">{{i.name}}</span><span style="font-size: 13px; color: #51546F">{{i.desc}}</span><span style="font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums">{{i.price}}</span></span>
        <sc-if value="{{ i.inCart }}" hint-placeholder-val="{{ false }}"><span style="min-width: 44px; height: 44px; border-radius: 12px; background: #3B35B5; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px">{{i.qty}}</span></sc-if>
        <sc-if value="{{ i.notIn }}" hint-placeholder-val="{{ true }}"><button type="button" aria-label="Tambah {{i.name}}" style="width: 44px; height: 44px; border-radius: 12px; border: 2px solid #3B35B5; background: #FFFFFF; color: #3B35B5; font-size: 24px; font-weight: 700">+</button></sc-if>
      </li>
    </sc-for>
  </ul>
  <div style="padding: 12px 16px 22px; border-top: 1px solid #D9DBEA"><button type="button" style="width: 100%; height: 60px; border-radius: 14px; border: 0; background: #3B35B5; color: #FFFFFF; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px"><span>3 item · kirim pesanan</span><span style="font-variant-numeric: tabular-nums">Rp42.000</span></button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cats = ['Terlaris', 'Kopi', 'Non-kopi', 'Makanan', 'Camilan'].map((c, i) => ({ label: c, on: i === 0, border: i === 0 ? '0' : '1px solid #D9DBEA', bg: i === 0 ? '#3B35B5' : '#FFFFFF', fg: i === 0 ? '#FFFFFF' : '#181A2E' }));
    const I = [['Es Kopi Susu Aren', 'Espresso, susu, gula aren', 'Rp18.000', '#F3E6DA', 2], ['Pisang Goreng Keju', 'Pisang kepok, keju, susu kental', 'Rp15.000', '#FFF0C7', 0], ['Es Teh Manis', 'Teh melati', 'Rp6.000', '#DDF0EA', 1], ['Nasi Goreng Spesial', 'Telur, ayam suwir, kerupuk', 'Rp25.000', '#FCE3D6', 0], ['Kopi Latte Panas', 'Espresso, susu', 'Rp22.000', '#F3E6DA', 0], ['Roti Bakar Cokelat', 'Roti tebal, cokelat, keju', 'Rp14.000', '#FFF0C7', 0]];
    const items = I.map(i => ({ name: i[0], desc: i[1], price: i[2], bg: i[3], qty: i[4], inCart: i[4] > 0, notIn: i[4] === 0 }));
    return { cats: cats, items: items };
  }
}
</script>
</body>
</html>
