<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Layar dapur</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#A39EFF}a:hover{color:#C9C6FF}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #FFC23D;outline-offset:2px}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #10111D; color: #ECECF6; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">
  <header style="height: 68px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 1px solid #2B2D44">
    <span style="font-size: 20px; font-weight: 800">Dapur · Kedai Kopi Senja</span>
    <span style="padding: 5px 12px; border-radius: 999px; background: #29285C; color: #C9C6FF; font-size: 14px; font-weight: 800">6 pesanan aktif</span>
    <div style="flex: 1"></div>
    <div role="tablist" aria-label="Stasiun" style="display: flex; gap: 6px; background: #1E2033; padding: 4px; border-radius: 12px">
      <button type="button" role="tab" aria-selected="true" style="height: 44px; padding: 0 16px; border-radius: 9px; border: 0; background: #ECECF6; color: #10111D; font-weight: 800; font-size: 15px">Semua · 6</button>
      <button type="button" role="tab" aria-selected="false" style="height: 44px; padding: 0 16px; border-radius: 9px; border: 0; background: transparent; color: #A6A9C4; font-weight: 700; font-size: 15px">Makanan · 5</button>
      <button type="button" role="tab" aria-selected="false" style="height: 44px; padding: 0 16px; border-radius: 9px; border: 0; background: transparent; color: #A6A9C4; font-weight: 700; font-size: 15px">Minuman · 3</button>
    </div>
    <button type="button" style="height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #3A3D58; background: transparent; color: #ECECF6; font-weight: 700; font-size: 15px">Riwayat selesai</button>
    <span style="font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums">15.42</span>
  </header>

  <div style="flex: 1; min-height: 0; padding: 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 14px">
    <sc-for list="{{ tickets }}" as="t" hint-placeholder-count="6">
      <article aria-label="{{t.aria}}" style="grid-row: span {{t.rows}}; background: #1E2033; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; border: 2px solid {{t.edge}}">
        <div style="padding: 10px 14px; background: {{t.headBg}}; color: {{t.headFg}}; display: flex; flex-direction: column; gap: 2px">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <span style="font-size: 20px; font-weight: 800">{{t.title}}</span>
            <span style="font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums">{{t.timer}}</span>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 700">
            <span>{{t.channel}}</span><span>{{t.state}}</span>
          </div>
        </div>
        <div style="flex: 1; min-height: 0; padding: 8px 14px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
          <sc-for list="{{ t.items }}" as="i" hint-placeholder-count="2">
            <div style="display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid #2B2D44">
              <span style="font-size: 22px; font-weight: 800; min-width: 34px; font-variant-numeric: tabular-nums">{{i.qty}}×</span>
              <span style="display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 18px; font-weight: 700; line-height: 1.3">{{i.name}}</span>
                <span style="font-size: 15px; color: #FFD98A; font-weight: 600; line-height: 1.35">{{i.note}}</span>
              </span>
            </div>
          </sc-for>
        </div>
        <div style="padding: 10px 14px 14px">
          <button type="button" style="width: 100%; height: 56px; border-radius: 12px; border: 0; background: #ECECF6; color: #10111D; font-weight: 800; font-size: 17px">Selesai · panggil pelayan</button>
        </div>
      </article>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const AGE = {
      late: { headBg: '#B42318', headFg: '#FFFFFF', edge: '#FF8F84', state: 'Lewat 10 menit' },
      warn: { headBg: '#F2B53A', headFg: '#1E1300', edge: '#F2B53A', state: 'Segera' },
      fresh: { headBg: '#16774A', headFg: '#FFFFFF', edge: '#2B2D44', state: 'Baru' }
    };
    const T = [
      { title: 'Meja 5', channel: 'Makan di sini', timer: '12:40', age: 'late', rows: 1, items: [{ qty: 1, name: 'Soto Ayam Lamongan', note: 'Tanpa koya' }, { qty: 1, name: 'Pisang Goreng Keju', note: 'Keju dibanyakin' }] },
      { title: 'GoFood F-221', channel: 'Diambil kurir 15.50', timer: '08:15', age: 'warn', rows: 2, items: [{ qty: 2, name: 'Nasi Goreng Spesial', note: 'Pedas level 2 · 1 porsi tanpa acar' }, { qty: 2, name: 'Es Teh Manis', note: 'Bungkus terpisah' }, { qty: 1, name: 'Kerupuk', note: '' }] },
      { title: 'Bawa pulang A-118', channel: 'Ditunggu di kasir', timer: '06:02', age: 'warn', rows: 1, items: [{ qty: 1, name: 'Ayam Geprek Sambal Matah', note: 'Level 3' }, { qty: 1, name: 'Es Jeruk Peras', note: '' }] },
      { title: 'Meja 7', channel: 'Makan di sini', timer: '03:30', age: 'fresh', rows: 2, items: [{ qty: 1, name: 'Es Kopi Susu Aren', note: 'Kurang manis · extra shot' }, { qty: 2, name: 'Kopi Latte Panas', note: '' }, { qty: 1, name: 'Roti Bakar Cokelat', note: 'Potong 4' }] },
      { title: 'GrabFood GF-87', channel: 'Diambil kurir 16.05', timer: '01:10', age: 'fresh', rows: 1, items: [{ qty: 3, name: 'Mie Goreng Jawa', note: '1 porsi tidak pedas' }] },
      { title: 'Meja 2', channel: 'Makan di sini', timer: '02:05', age: 'fresh', rows: 1, items: [{ qty: 1, name: 'Kentang Goreng', note: 'Saus terpisah' }, { qty: 1, name: 'Tahu Cabai Garam', note: '' }] }
    ];
    const tickets = T.map(t => {
      const a = AGE[t.age];
      return Object.assign({}, t, { headBg: a.headBg, headFg: a.headFg, edge: a.edge, state: a.state, aria: t.title + ', ' + a.state + ', ' + t.timer });
    });
    return { tickets: tickets };
  }
}
</script>
</body>
</html>
