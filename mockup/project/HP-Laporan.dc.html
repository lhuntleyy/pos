<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Laporan pemilik di HP</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3B35B5}a:hover{color:#2A2590}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #E39D00;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F6FB; color: #181A2E; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">
  <div style="flex: 1; min-height: 0; overflow: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 22px; font-weight: 800">Laporan</span><button type="button" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #D9DBEA; background: #FFFFFF; color: #181A2E; font-weight: 700; font-size: 14px">Semua outlet</button></div>
    <div role="group" aria-label="Periode" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #EDEEF7; padding: 4px; border-radius: 12px">
      <button type="button" aria-pressed="false" style="height: 44px; border-radius: 9px; border: 0; background: transparent; color: #51546F; font-weight: 700; font-size: 15px">Hari ini</button>
      <button type="button" aria-pressed="true" style="height: 44px; border-radius: 9px; border: 0; background: #FFFFFF; color: #3B35B5; font-weight: 800; font-size: 15px">Minggu ini</button>
      <button type="button" aria-pressed="false" style="height: 44px; border-radius: 9px; border: 0; background: transparent; color: #51546F; font-weight: 700; font-size: 15px">Bulan ini</button>
    </div>
    <section aria-label="Untung rugi" style="background: #FFFFFF; border: 1px solid #D9DBEA; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 17px; font-weight: 800">Untung rugi sederhana · 9–15 Nov</span>
      <sc-for list="{{ pl }}" as="r" hint-placeholder-count="5">
        <div style="display: flex; justify-content: space-between; font-size: {{r.size}}px; font-weight: {{r.w}}; padding: 6px 0; border-top: {{r.line}}; color: {{r.fg}}"><span>{{r.label}}</span><span style="font-variant-numeric: tabular-nums">{{r.v}}</span></div>
      </sc-for>
    </section>
    <section aria-label="Per outlet" style="background: #FFFFFF; border: 1px solid #D9DBEA; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 17px; font-weight: 800">Penjualan per outlet</span>
      <sc-for list="{{ outlets }}" as="o" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 4px"><div style="display: flex; justify-content: space-between; font-size: 15px"><span style="font-weight: 700">{{o.name}}</span><span style="font-variant-numeric: tabular-nums">{{o.v}}</span></div><div style="height: 10px; border-radius: 5px; background: #EDEEF7"><div style="width: {{o.pct}}%; height: 100%; border-radius: 5px; background: {{o.bg}}"></div></div></div>
      </sc-for>
    </section>
    <section aria-label="Cara bayar" style="background: #FFFFFF; border: 1px solid #D9DBEA; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 17px; font-weight: 800">Cara bayar</span>
      <div style="display: flex; height: 16px; border-radius: 999px; overflow: hidden; gap: 2px"><span style="width: 46%; background: #3B35B5"></span><span style="width: 33%; background: #7C78E0"></span><span style="width: 13%; background: #E39D00"></span><span style="width: 8%; background: #9A6200"></span></div>
      <span style="font-size: 14px; color: #51546F">Tunai 46% · QRIS 33% · Ojol 13% · Kartu &amp; transfer 8%</span>
    </section>
    <div style="display: flex; gap: 10px"><button type="button" style="flex: 1; height: 52px; border-radius: 12px; border: 1px solid #D9DBEA; background: #FFFFFF; color: #181A2E; font-weight: 800; font-size: 15px">Unduh Excel</button><button type="button" style="flex: 1; height: 52px; border-radius: 12px; border: 1px solid #D9DBEA; background: #FFFFFF; color: #181A2E; font-weight: 800; font-size: 15px">Kirim ke WA</button></div>
  </div>
  <nav aria-label="Navigasi utama" style="height: 76px; flex: none; background: #FFFFFF; border-top: 1px solid #D9DBEA; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 6px">
    <button type="button" style="border: 0; background: transparent; color: #51546F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 600; font-size: 13px"><span style="width: 52px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg></span>Beranda</button>
    <button type="button" aria-current="page" style="border: 0; background: transparent; color: #3B35B5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 800; font-size: 13px"><span style="width: 52px; height: 30px; border-radius: 999px; background: #E6E5FA; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg></span>Laporan</button>
    <button type="button" style="border: 0; background: transparent; color: #51546F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 600; font-size: 13px"><span style="width: 52px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg></span>Stok</button>
    <button type="button" style="border: 0; background: transparent; color: #51546F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 600; font-size: 13px"><span style="width: 52px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></span>Akun</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (label, v, opt) => Object.assign({ label: label, v: v, size: 15, w: 500, line: '0', fg: '#181A2E' }, opt || {});
    const pl = [row('Penjualan bersih', 'Rp68.240.000'), row('Modal barang terjual (HPP)', '−Rp29.530.000', { fg: '#51546F' }), row('Laba kotor', 'Rp38.710.000', { w: 800, line: '1px solid #EDEEF7' }), row('Biaya (kas keluar, gaji harian)', '−Rp9.860.000', { fg: '#51546F' }), row('Perkiraan laba bersih', 'Rp28.850.000', { size: 18, w: 800, line: '2px solid #181A2E', fg: '#16774A' })];
    const outlets = [['Kemang', 'Rp29.400.000', 100, '#3B35B5'], ['Senopati', 'Rp24.100.000', 82, '#7C78E0'], ['Tebet', 'Rp14.740.000', 50, '#B9B6EE']].map(o => ({ name: o[0], v: o[1], pct: o[2], bg: o[3] }));
    return { pl: pl, outlets: outlets };
  }
}
</script>
</body>
</html>
