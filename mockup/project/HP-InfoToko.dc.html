<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Info usaha dan pajak</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3B35B5}a:hover{color:#2A2590}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #E39D00;outline-offset:2px}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F6FB; color: #181A2E; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">
  <div style="padding: 20px 20px 8px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <button type="button" aria-label="Kembali" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #D9DBEA; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #181A2E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
      <span style="font-size: 15px; font-weight: 700; color: #51546F">Langkah 3 dari 4</span>
      <span style="width: 48px"></span>
    </div>
    <div role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="3" aria-label="Langkah pendaftaran" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px"><span style="height: 6px; border-radius: 3px; background: #3B35B5"></span><span style="height: 6px; border-radius: 3px; background: #3B35B5"></span><span style="height: 6px; border-radius: 3px; background: #3B35B5"></span><span style="height: 6px; border-radius: 3px; background: #D9DBEA"></span></div>
    <h1 style="margin: 6px 0 0; font-size: 26px; font-weight: 800">Tentang usaha Anda</h1>
  </div>
  <div style="flex: 1; min-height: 0; overflow: auto; padding: 8px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <label for="nama-usaha" style="display: flex; flex-direction: column; gap: 6px; font-size: 16px; font-weight: 700">Nama usaha (tampil di struk)<input id="nama-usaha" type="text" value="Kedai Kopi Senja" style="height: 56px; border-radius: 12px; border: 1px solid #D9DBEA; padding: 0 14px; font-size: 18px; font-weight: 600; background: #FFFFFF"></label>
    <label for="kota" style="display: flex; flex-direction: column; gap: 6px; font-size: 16px; font-weight: 700">Kota / kabupaten<input id="kota" type="text" value="Kota Jakarta Selatan" style="height: 56px; border-radius: 12px; border: 1px solid #D9DBEA; padding: 0 14px; font-size: 18px; font-weight: 600; background: #FFFFFF"></label>
    <div style="display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 1px dashed #B9BCD3; border-radius: 14px; background: #FFFFFF"><span style="width: 56px; height: 56px; border-radius: 14px; background: #EDEEF7; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #51546F">Logo</span><span style="flex: 1; font-size: 15px; color: #51546F">Tambah logo untuk struk (opsional)</span><button type="button" style="height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #D9DBEA; background: #FFFFFF; color: #181A2E; font-weight: 700; font-size: 14px">Pilih foto</button></div>
    <section aria-label="Pajak" style="background: #FFFFFF; border: 2px solid #3B35B5; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 17px; font-weight: 800">Pajak kami atur otomatis</span>
      <span style="font-size: 15px; color: #51546F; line-height: 1.5">Untuk kafe di Kota Jakarta Selatan, pajak makan-minum (PBJT) <b style="color: #181A2E">10%</b>. Kalau usaha Anda belum terdaftar sebagai wajib pajak daerah, matikan saja.</span>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 48px"><span style="flex: 1; font-size: 16px; font-weight: 700">PBJT 10%</span><span role="switch" aria-checked="true" aria-label="PBJT 10%" style="display: inline-flex; width: 52px; height: 30px; border-radius: 999px; background: #3B35B5; padding: 3px; box-sizing: border-box; justify-content: flex-end"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF"></span></span></div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 48px"><span style="flex: 1; font-size: 16px; font-weight: 700">Service charge</span><span role="switch" aria-checked="false" aria-label="Service charge" style="display: inline-flex; width: 52px; height: 30px; border-radius: 999px; background: #B9BCD3; padding: 3px; box-sizing: border-box; justify-content: flex-start"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF"></span></span></div>
      <span style="font-size: 15px; font-weight: 700">Harga menu Anda</span>
      <div role="group" aria-label="Harga menu" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-pressed="true" style="min-height: 56px; border-radius: 12px; border: 2px solid #3B35B5; background: #F1F0FD; color: #181A2E; font-weight: 800; font-size: 14px; padding: 6px 10px">Belum termasuk pajak</button>
        <button type="button" aria-pressed="false" style="min-height: 56px; border-radius: 12px; border: 1px solid #D9DBEA; background: #FFFFFF; color: #181A2E; font-weight: 700; font-size: 14px; padding: 6px 10px">Sudah termasuk pajak</button>
      </div>
    </section>
  </div>
  <div style="padding: 12px 20px 24px; background: #FFFFFF; border-top: 1px solid #D9DBEA"><button type="button" style="width: 100%; height: 60px; border-radius: 14px; border: 0; background: #3B35B5; color: #FFFFFF; font-weight: 800; font-size: 18px">Lanjut</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
